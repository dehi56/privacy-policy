name: Threads 自動投稿

on:
  schedule:
    # 投稿枠ちょうどに起動するのではなく、30分おきに起動して枠を拾いにいく。
    # GitHub Actionsのスケジュール実行は混雑時に1時間以上遅れるだけでなく、
    # 起動そのものが破棄されることがあるため(実測で6回中5回が消えた日がある)、
    # 枠ごとに1回だけの起動では取りこぼす。
    #
    # スクリプト側は「定刻を過ぎて90分以内」の枠だけを拾うので、
    # 1枠につき3回の機会がある。予定の無い時刻に起動しても何もせず終了する。
    # 同じ枠を複数の起動が拾った場合は、送信前に投稿済みかを確認して弾く。
    #
    # 毎時00分はGitHub側が最も混み合って破棄されやすいので、20分と50分にずらす。
    - cron: "20,50 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "送信せず内容だけ確認する"
        type: boolean
        default: true
      slot:
        description: "テストしたい枠 (例 2026-08-20T10:00)。空なら現在時刻で判定"
        type: string
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SLOT_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
        run: python threads/post_to_threads.py
